# Stage 1 dataset registry — Table 1 expectations are IMMUTABLE.
#
# `n_samples`, `n_features` and `n_classes` below are transcribed from Table 1 of
# Zhou, Zhao, Yan & Wu, "Online Scalable Streaming Feature Selection via Dynamic
# Decision", ACM TKDD 16(5) art. 87 (2022). They are a PREREGISTERED specification:
# the code compares observed values against them and never edits them to fit a
# downloaded file.
#
# `n_features` counts PREDICTOR COLUMNS ONLY. The class-label column is never
# counted as a feature.
#
# `paper_feature_type` reproduces the paper's own wording. It is stored separately
# from the dtype actually parsed, because sources disagree with the paper and with
# each other (UCI describes ARCENE as continuous). That disagreement is recorded,
# never resolved by falsifying a dtype.

schema_version: 1
paper:
  title: "Online Scalable Streaming Feature Selection via Dynamic Decision"
  authors: "Peng Zhou, Shu Zhao, Yuanting Yan, Xindong Wu"
  venue: "ACM TKDD 16(5), Article 87"
  year: 2022
  doi: "10.1145/3502737"
  table: "Table 1"
  cited_source_collections:
    - name: "Binghamton legacy research datasets (Wei Lyu, KDD08)"
      url_as_cited_in_paper: "http://www.cs.binghamton.edu/~lyu/KDD08/data/"
      availability_at_stage1_runtime: "LIVE (HTTP 301 to https, directory listing served)"
    - name: "UCI Machine Learning Repository"
      url: "https://archive.ics.uci.edu/"
      availability_at_stage1_runtime: "LIVE"

# Provenance tier vocabulary:
#   paper_cited          the URL is the paper's own cited collection
#   official             the dataset owner's own archive (UCI / OpenML / source author)
#   academic_repository  a documented academic or institutional repository
#   mirror               an unofficial redistribution
# confidence vocabulary: high | medium | low   (rationale required in `provenance_note`)

datasets:

  # ---------------------------------------------------------------- 1 ------
  - id: 1
    key: SRBCT
    name: SRBCT
    n_samples: 63
    n_features: 2308
    n_classes: 4
    paper_feature_type: Real
    domain: microarray
    task: small-sample-round-cell-cancer-diagnosis
    label_semantics: "4 tumour classes of the NCI-60 small round blue cell tumour panel"
    source_splits: []                    # single source file, no train/valid partition
    provenance_tier: paper_cited
    provenance_confidence: high
    provenance_note: >
      Fetched from the exact URL collection cited in the paper's Section 4.1.1
      footnote. Attribute count and class count observed in the file agree with
      Table 1. Note the source file carries a "-std" suffix, i.e. a standardised
      release produced upstream by the Binghamton collection; this is PREEXISTING
      preprocessing by the source, NOT applied by this pipeline. The paper does
      not state whether it consumed the "-std" variant, so that remains an
      explicitly documented open question rather than an assumed fact.
    alternatives_rejected:
      - what: "mixOmics `srbct` (63 samples) and other SRBCT variants with 83 samples"
        why_rejected_at_stage1: >
          Not needed: the paper-cited source already matches Table 1 exactly.
          The 83-sample variant is explicitly out of scope (would add 20 test
          samples not present in the paper).
    citation: "Khan J. et al., Cancer Res 61(16):6469-6476 (2001); NCI-60 small round blue cell tumour panel."
    license: "license_unknown — academic research redistribution, no licence published on the cited page"
    sources:
      - tier: paper_cited
        url: "https://www.cs.binghamton.edu/~lyu/KDD08/data/srbct-std.arff"
        format: arff
        filename_in_archive: srbct-std.arff
        expected_sha256: unknown
        verified_at_runtime: false

