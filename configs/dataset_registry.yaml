  # ---------------------------------------------------------------- 5 ------
  - id: 5
    key: DLBCL
    name: DLBCL
    n_samples: 77
    n_features: 7129
    n_classes: 2
    paper_feature_type: Integer
    domain: microarray
    task: diffuse-large-b-cell-lymphoma-classification
    label_semantics: "DLBCL vs follicular lymphoma (FL) — 58 vs 19"
    source_splits: []
    provenance_tier: academic_repository
    provenance_confidence: medium
    provenance_note: >
      NOT present in either collection cited by the paper, so the paper's own
      source cannot be used. Obtained from the TU Berlin Machine Learning
      Repository, dataset page `dlbcl-tumor-from-harvard`, which documents the
      record as coming from the UCI/LibSVM-era Kent Ridge collection and states
      "7130 attributes, 77 instances" on its own index page. The repository's
      description of the two Shipp et al. (2002) classification problems
      matches the observed class semantics exactly (58 DLBCL vs 19 FL
      observed in the parsed data). Lineage is therefore documented and
      self-consistent, but it is NOT the paper's cited source and the paper does
      not state which DLBCL variant it used, so provenance is recorded as
      substantiated-but-not-cited rather than as certain.
    alternatives_rejected:
      - what: "OpenML DLBCL did=45088 (77 instances, 5469 numeric features)"
        why_rejected_at_stage1: >
          Sample count matches but the feature count is 5469, not 7129. This is
          exactly the reprocessed DLBCL variant the Stage 1 prompt says to reject.
      - what: "TU Berlin `dlbcl-outcome-from-harvard` (58 instances, 7129 attributes)"
        why_rejected_at_stage1: "58 instances, not 77 — this is the cured-vs-fatal subset, a different classification problem."
      - what: "TU Berlin `dlbcl-nih` (240 x 7399)"
        why_rejected_at_stage1: "Different cohort, different sample and feature counts."
      - what: "ico2s.org DLBCL (7129 genes x 77 samples, per its index text)"
        why_rejected_at_stage1: "Dead link — the file is named in the page text but no href exists in the served HTML and the conventional paths return HTTP 404."
    citation: "Shipp M.A. et al., Nature Medicine 8(1):68-74 (2002) — DLBCL outcome prediction by gene-expression profiling."
    license: "license_unknown — repository states 'License: unknown (from UCI repository)'"
    sources:
      - tier: academic_repository
        url: "https://mldata-static.ml.tu-berlin.de/repository/data/download/csv/dlbcl-tumor-from-harvard/index.html"
        format: csv_label_last
        filename_in_archive: dlbcl-tumor-from-harvard.csv
        expected_sha256: unknown
        verified_at_runtime: false
        notes: >
          The repository serves the payload itself at this path (Content-Type is
          mislabelled text/html; the body is a plain CSV). Documented shape on the
          index page: 7130 attributes, 77 instances.

